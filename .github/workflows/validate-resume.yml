name: Resume system validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        run: bash pipeline/validate_resume_repo.sh

      - name: Compile the pipeline and job-search code
        run: python3 -m compileall -q pipeline job-search

      - name: Validator contract tests
        run: bash pipeline/test_validate_contract.sh

      - name: Install job-search schema validator
        run: python3 -m pip install --requirement job-search/requirements.txt

      - name: Job-posting contract tests
        run: python3 -m unittest discover -s job-search/tests -v

      - name: Run offline job-search workflow
        run: python3 job-search/job_search.py run-fixtures --fixtures job-search/fixtures/sample-search-results.json --state /tmp/job-search-state/jobs.json --eligibility-checks /tmp/no-eligibility-checks.json

      - name: Validate schema JSON
        run: python3 -c "import json; json.load(open('job-search/schemas/job-posting.schema.json', encoding='utf-8'))"

  build-resumes:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex fonts-lato poppler-utils

      - name: Build all active resumes
        run: bash pipeline/build_base_resumes.sh

      - name: PDF text and page QA
        run: |
          set -euo pipefail
          mkdir -p /tmp/resume-artifacts
          for mode in referral startup mnc; do
            pdf="/tmp/resume-base-build/$mode/resume.pdf"
            test -s "$pdf"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test "$pages" = "1"
            pdftotext -layout "$pdf" "/tmp/resume-artifacts/${mode}.txt"
            grep -q "Soham" "/tmp/resume-artifacts/${mode}.txt"
            test -s "/tmp/resume-artifacts/${mode}.txt"
            pdftoppm -singlefile -png -r 120 "$pdf" "/tmp/resume-artifacts/${mode}"
          done

      - name: Build and QA the example run
        run: |
          set -euo pipefail
          run=applications/SWE_MNC_2026-10/output
          mkdir -p /tmp/resume-base-build/application
          ( cd "$run" && for _ in 1 2; do xelatex -output-directory=/tmp/resume-base-build/application -interaction=nonstopmode -halt-on-error resume.tex; done )
          test -s /tmp/resume-base-build/application/resume.pdf
          pages="$(pdfinfo /tmp/resume-base-build/application/resume.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" = "1"
          pdftotext -layout /tmp/resume-base-build/application/resume.pdf /tmp/resume-artifacts/run.txt
          grep -q "Soham" /tmp/resume-artifacts/run.txt

      - name: Upload resume QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-qa
          path: |
            /tmp/resume-base-build/referral/resume.pdf
            /tmp/resume-base-build/startup/resume.pdf
            /tmp/resume-base-build/mnc/resume.pdf
            /tmp/resume-base-build/application/resume.pdf
            /tmp/resume-artifacts/*.txt
            /tmp/resume-artifacts/*.png
