name: Resume checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository contract
        run: bash pipeline/validate_resume_repo.sh
      - name: Test repository validator
        run: bash pipeline/test_validate_contract.sh
      - name: Build base resumes
        run: bash pipeline/build_base_resumes.sh
